name: Terraform CI/CD - All Environments

on:
  push:
    branches:
      - main
concurrency:
  group: terraform-state
  cancel-in-progress: true
  
jobs:
  dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_vm_username: ${{ secrets.TF_VAR_vm_username }}
      TF_VAR_vm_password: ${{ secrets.TF_VAR_vm_password }}
      BACKEND_SA: ${{ secrets.BACKEND_SA }}
      BACKEND_CONTAINER: ${{ secrets.BACKEND_CONTAINER }}
      ARM_USE_OIDC: false
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Init (Dev)
        run: terraform init

      - name: Plan (Dev)
        run: terraform plan -var-file="environments/dev/terraform.tfvars"

      - name: Apply (Dev)
        run: terraform apply -auto-approve -var-file="environments/dev/terraform.tfvars"
      - name: Azure CLI Login
        if: failure()
        run: |
          az login --service-principal \
            --username $ARM_CLIENT_ID \
            --password $ARM_CLIENT_SECRET \
            --tenant $ARM_TENANT_ID
      
      - name: Auto Unlock if Failed
        if: failure()
        run: |
          STATE_FILE="3tier/dev.terraform.tfstate"
          LOCK_ID=$(az storage blob metadata show \
            --account-name "$BACKEND_SA" \
            --container-name "$BACKEND_CONTAINER" \
            --name "$STATE_FILE" \
            --auth-mode login \
            --query "lockId" -o tsv)
      
          if [ ! -z "$LOCK_ID" ]; then
            echo "Unlocking stale metadata lock: $LOCK_ID"
            terraform force-unlock -force "$LOCK_ID"
          else
            echo "No lock metadata found"
          fi
          
          
  test:
    name: Deploy Test
    runs-on: ubuntu-latest
    needs: dev
    environment: test
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_vm_username: ${{ secrets.TF_VAR_vm_username }}
      TF_VAR_vm_password: ${{ secrets.TF_VAR_vm_password }}
      BACKEND_SA: ${{ secrets.BACKEND_SA }}
      BACKEND_CONTAINER: ${{ secrets.BACKEND_CONTAINER }}
      ARM_USE_OIDC: false
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Init (Test)
        run: terraform init

      - name: Plan (Test)
        run: terraform plan -var-file="environments/test/terraform.tfvars"

      - name: Apply (Test)
        run: terraform apply -auto-approve -var-file="environments/test/terraform.tfvars"

      - name: Azure CLI Login
        if: failure()
        run: |
          az login --service-principal \
            --username $ARM_CLIENT_ID \
            --password $ARM_CLIENT_SECRET \
            --tenant $ARM_TENANT_ID

      - name: Auto Unlock if Failed
        if: failure()
        run: |
          STATE_FILE="3tier/dev.terraform.tfstate"
          LOCK_ID=$(az storage blob metadata show \
            --account-name "$BACKEND_SA" \
            --container-name "$BACKEND_CONTAINER" \
            --name "$STATE_FILE" \
            --auth-mode login \
            --query "lockId" -o tsv)
      
          if [ ! -z "$LOCK_ID" ]; then
            echo "Unlocking stale metadata lock: $LOCK_ID"
            terraform force-unlock -force "$LOCK_ID"
          else
            echo "No lock metadata found"
          fi
            
      
          
  prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs: test
    environment: prod
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_vm_username: ${{ secrets.TF_VAR_vm_username }}
      TF_VAR_vm_password: ${{ secrets.TF_VAR_vm_password }}
      BACKEND_SA: ${{ secrets.BACKEND_SA }}
      BACKEND_CONTAINER: ${{ secrets.BACKEND_CONTAINER }}
      ARM_USE_OIDC: false
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Init (Prod)
        run: terraform init

      - name: Plan (Prod)
        run: terraform plan -var-file="environments/prod/terraform.tfvars"

      - name: Apply (Prod)
        run: terraform apply -auto-approve -var-file="environments/prod/terraform.tfvars"
      
      - name: Azure CLI Login
        if: failure()
        run: |
          az login --service-principal \
            --username $ARM_CLIENT_ID \
            --password $ARM_CLIENT_SECRET \
            --tenant $ARM_TENANT_ID

      - name: Auto Unlock if Failed
        if: failure()
        run: |
          STATE_FILE="3tier/dev.terraform.tfstate"
          LOCK_ID=$(az storage blob metadata show \
            --account-name "$BACKEND_SA" \
            --container-name "$BACKEND_CONTAINER" \
            --name "$STATE_FILE" \
            --auth-mode login \
            --query "lockId" -o tsv)
      
          if [ ! -z "$LOCK_ID" ]; then
            echo "Unlocking stale metadata lock: $LOCK_ID"
            terraform force-unlock -force "$LOCK_ID"
          else
            echo "No lock metadata found"
          fi
